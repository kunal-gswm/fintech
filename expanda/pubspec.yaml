name: expanda
description: "EXPANDA — AI-powered personal finance tracker."
publish_to: 'none'
version: 2.0.45+45

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^17.3.0

  # Local persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # Charts
  fl_chart: ^0.70.2

  # Camera & OCR
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.14.0

  # AI chat rendering
  flutter_markdown: ^0.7.6+2

  # Auth
  local_auth: ^2.3.0

  # Sharing & Export
  share_plus: ^10.1.4
  csv: ^6.0.0
  excel: ^4.0.1
  pdf: ^3.11.3
  printing: ^5.13.5

  # Celebrations
  confetti: ^0.8.0

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Network
  http: ^1.3.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  path: ^1.9.1
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.jpg"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.jpg

