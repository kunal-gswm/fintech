name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Generate Version Tag
        id: version
        run: echo "tag=v1.3.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_APP_VERSION: ${{ steps.version.outputs.tag }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/expanda.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expanda-apk
          path: android/app/build/outputs/apk/debug/expanda.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          files: android/app/build/outputs/apk/debug/expanda.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
