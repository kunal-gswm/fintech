name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Version Tag
        id: version
        run: echo "tag=v2.0.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        working-directory: ./expanda
        run: flutter pub get

      - name: Run Tests
        working-directory: ./expanda
        run: flutter test

      - name: Build Release APK
        working-directory: ./expanda
        run: flutter build apk --release

      - name: Rename APK
        run: mv expanda/build/app/outputs/flutter-apk/app-release.apk expanda/build/app/outputs/flutter-apk/expanda.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: expanda-apk
          path: expanda/build/app/outputs/flutter-apk/expanda.apk

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: EXPANDA v2.0.${{ github.run_number }}
          body: |
            Automated production build for EXPANDA Mobile (Flutter Migration).
            Download the APK below to install on your mobile device.
          files: expanda/build/app/outputs/flutter-apk/expanda.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
